name: OwnTerm CI

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    name: Audit Zero-Telemetry & Anti-Coupling
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install ripgrep
        run: |
          sudo apt-get update
          sudo apt-get install -y ripgrep

      - name: Run audit script
        shell: bash
        run: |
          chmod +x scripts/audit-warp-services.sh
          ./scripts/audit-warp-services.sh . || true

  build:
    name: Build (${{ matrix.os }} - ${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            target: aarch64-apple-darwin
            artifact_name: ownterm-macos-arm64
            binary_name: ownterm
          - os: macos-14
            target: x86_64-apple-darwin
            artifact_name: ownterm-macos-x86_64
            binary_name: ownterm
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            artifact_name: ownterm-linux-x86_64
            binary_name: ownterm
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact_name: ownterm-windows-x86_64
            binary_name: ownterm.exe

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install Protoc
        uses: arduino/setup-protoc@v3
        with:
          version: "25.x"
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup macOS Environment
        if: runner.os == 'macOS'
        run: |
          echo "WARP_LOCAL_SKIP_METAL=1" >> "$GITHUB_ENV"

      - name: Install dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            pkg-config \
            libasound2-dev \
            libfontconfig1-dev \
            libfreetype6-dev \
            libxcb-xfixes0-dev \
            libxkbcommon-dev \
            libssl-dev \
            libx11-dev \
            libxcursor-dev \
            libxi-dev \
            libxrandr-dev \
            libgl1-mesa-dev

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Build OwnTerm GUI & TUI
        shell: bash
        run: |
          cargo build --release --target ${{ matrix.target }} -p warp --bin ownterm
          cargo build --release --target ${{ matrix.target }} -p warp_tui --bin ownterm-tui

      - name: Run Core Tests (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          cargo test -p warp_core

      - name: Package Artifacts (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          mkdir -p staging
          cp "target/${{ matrix.target }}/release/ownterm" staging/ownterm
          cp "target/${{ matrix.target }}/release/ownterm-tui" staging/ownterm-tui
          cp README.md staging/
          cp LICENSE-AGPL staging/ || true
          cp LICENSE-MIT staging/ || true
          if [ -d "app/channels/oss" ]; then
            cp -r app/channels/oss staging/assets || true
          fi
          cd staging
          tar -czf "../${{ matrix.artifact_name }}.tar.gz" *
          cd ..
          shasum -a 256 "${{ matrix.artifact_name }}.tar.gz" > "${{ matrix.artifact_name }}.tar.gz.sha256"

      - name: Package Artifacts (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          mkdir -p staging
          cp "target/${{ matrix.target }}/release/ownterm.exe" staging/ownterm.exe
          cp "target/${{ matrix.target }}/release/ownterm-tui.exe" staging/ownterm-tui.exe
          cp README.md staging/
          cp LICENSE-AGPL staging/ || true
          cp LICENSE-MIT staging/ || true
          cd staging
          tar -czf "../${{ matrix.artifact_name }}.tar.gz" *
          cd ..
          sha256sum "${{ matrix.artifact_name }}.tar.gz" > "${{ matrix.artifact_name }}.tar.gz.sha256"

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: |
            ${{ matrix.artifact_name }}.tar.gz
            ${{ matrix.artifact_name }}.tar.gz.sha256
