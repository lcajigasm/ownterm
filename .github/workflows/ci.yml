name: OwnTerm CI

on:
  pull_request:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  privacy-audit:
    name: Privacy audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Audit telemetry and login gates
        run: bash scripts/audit-ownterm-privacy.sh

  provider:
    name: Provider crate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@1.92.0
        with:
          components: rustfmt, clippy

      - name: Install system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libfontconfig1-dev libfreetype6-dev

      - name: Format
        run: cargo fmt -p ownterm_provider -- --check

      - name: Clippy
        run: cargo clippy -p ownterm_provider --all-targets --tests -- -D warnings

      - name: Test providers
        run: cargo test -p ownterm_provider

      - name: Test channel config
        run: cargo test -p warp_core --lib channel::config::tests

      - name: Test release installer
        run: bash script/test_install_ownterm.sh

  client-check:
    name: Client compile
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@1.92.0

      - name: Install system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            pkg-config \
            protobuf-compiler \
            g++ \
            libasound2-dev \
            libfontconfig1-dev \
            libfreetype6-dev \
            libxcb-xfixes0-dev \
            libxkbcommon-dev \
            libssl-dev \
            libx11-dev \
            libxcursor-dev \
            libxi-dev \
            libxrandr-dev \
            libgl1-mesa-dev

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          key: client-check-1.92

      - name: Typecheck OwnTerm GUI and TUI
        run: |
          cargo check -p warp --bin ownterm
          cargo check -p warp_tui --bin ownterm-tui
