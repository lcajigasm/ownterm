name: OwnTerm CI & Release

on:
  push:
    branches:
      - master
  workflow_dispatch:
    inputs:
      version_tag:
        description: 'Optional custom release tag (e.g. v0.2.0)'
        required: false
        default: ''

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prepare-version:
    name: Determine Next Release Version
    runs-on: ubuntu-latest
    outputs:
      new_tag: ${{ steps.calc_tag.outputs.new_tag }}
      version: ${{ steps.calc_tag.outputs.version }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Calculate Version Tag
        id: calc_tag
        shell: bash
        run: |
          if [ -n "${{ github.event.inputs.version_tag }}" ]; then
            TAG="${{ github.event.inputs.version_tag }}"
            if [[ ! "$TAG" =~ ^v ]]; then
              TAG="v$TAG"
            fi
            VER="${TAG#v}"
          else
            git fetch --tags --force
            LATEST_TAG=$(git tag -l "v*" | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -n 1 || true)
            echo "Latest semantic tag: $LATEST_TAG"
            if [ -z "$LATEST_TAG" ]; then
              TAG="v0.1.0"
              VER="0.1.0"
            else
              VER="${LATEST_TAG#v}"
              IFS='.' read -r MAJOR MINOR PATCH <<< "$VER"
              NEW_PATCH=$((PATCH + 1))
              TAG="v${MAJOR}.${MINOR}.${NEW_PATCH}"
              VER="${MAJOR}.${MINOR}.${NEW_PATCH}"
            fi
          fi
          echo "Next release tag: $TAG"
          echo "Next release version: $VER"
          echo "new_tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$VER" >> "$GITHUB_OUTPUT"

  audit:
    name: Audit Zero-Telemetry & Anti-Coupling
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install ripgrep
        run: |
          sudo apt-get update
          sudo apt-get install -y ripgrep

      - name: Run audit script
        shell: bash
        run: |
          chmod +x scripts/audit-warp-services.sh
          ./scripts/audit-warp-services.sh . || true

  build:
    name: Build (${{ matrix.os }} - ${{ matrix.target }})
    needs: [prepare-version]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            target: aarch64-apple-darwin
            artifact_name: ownterm-macos-arm64
            binary_name: ownterm
          - os: macos-14
            target: x86_64-apple-darwin
            artifact_name: ownterm-macos-x86_64
            binary_name: ownterm
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            artifact_name: ownterm-linux-x86_64
            binary_name: ownterm
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact_name: ownterm-windows-x86_64
            binary_name: ownterm.exe

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Ensure Rust Target Installed
        shell: bash
        run: |
          rustup target add ${{ matrix.target }}

      - name: Install Protoc
        uses: arduino/setup-protoc@v3
        with:
          version: "25.x"
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup macOS Environment
        if: runner.os == 'macOS'
        run: |
          echo "WARP_LOCAL_SKIP_METAL=1" >> "$GITHUB_ENV"

      - name: Install dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            pkg-config \
            libasound2-dev \
            libfontconfig1-dev \
            libfreetype6-dev \
            libxcb-xfixes0-dev \
            libxkbcommon-dev \
            libssl-dev \
            libx11-dev \
            libxcursor-dev \
            libxi-dev \
            libxrandr-dev \
            libgl1-mesa-dev

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Build OwnTerm GUI & TUI
        shell: bash
        run: |
          cargo build --release --target ${{ matrix.target }} -p warp --bin ownterm
          cargo build --release --target ${{ matrix.target }} -p warp_tui --bin ownterm-tui

      - name: Run Core Tests (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          cargo test -p warp_core

      - name: Package Artifacts (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          mkdir -p staging
          cp "target/${{ matrix.target }}/release/ownterm" staging/ownterm
          cp "target/${{ matrix.target }}/release/ownterm-tui" staging/ownterm-tui
          cp README.md staging/
          cp LICENSE-AGPL staging/ || true
          cp LICENSE-MIT staging/ || true
          if [ -d "app/channels/oss" ]; then
            cp -r app/channels/oss staging/assets || true
          fi
          cd staging
          tar -czf "../${{ matrix.artifact_name }}.tar.gz" *
          cd ..
          shasum -a 256 "${{ matrix.artifact_name }}.tar.gz" > "${{ matrix.artifact_name }}.tar.gz.sha256"

      - name: Package Artifacts (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          mkdir -p staging
          cp "target/${{ matrix.target }}/release/ownterm.exe" staging/ownterm.exe
          cp "target/${{ matrix.target }}/release/ownterm-tui.exe" staging/ownterm-tui.exe
          cp README.md staging/
          cp LICENSE-AGPL staging/ || true
          cp LICENSE-MIT staging/ || true
          cd staging
          tar -czf "../${{ matrix.artifact_name }}.tar.gz" *
          cd ..
          sha256sum "${{ matrix.artifact_name }}.tar.gz" > "${{ matrix.artifact_name }}.tar.gz.sha256"

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: |
            ${{ matrix.artifact_name }}.tar.gz
            ${{ matrix.artifact_name }}.tar.gz.sha256

  deploy-release:
    name: Deploy Multi-Platform Release
    needs: [prepare-version, audit, build]
    if: github.ref == 'refs/heads/master' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts

      - name: Consolidate Artifacts & Checksums
        shell: bash
        run: |
          mkdir -p dist
          find release-artifacts -type f -name "*.tar.gz" -exec cp {} dist/ \;
          find release-artifacts -type f -name "*.sha256" -exec cat {} + > dist/SHA256SUMS
          echo "Consolidated checksums:"
          cat dist/SHA256SUMS

      - name: Create & Push Git Tag
        shell: bash
        run: |
          TAG="${{ needs.prepare-version.outputs.new_tag }}"
          echo "Tagging commit with $TAG..."
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "$TAG" -m "OwnTerm Release $TAG"
          git push origin "$TAG" --force

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.prepare-version.outputs.new_tag }}
          name: OwnTerm ${{ needs.prepare-version.outputs.new_tag }}
          draft: false
          prerelease: false
          files: |
            dist/*
          body: |
            # OwnTerm ${{ needs.prepare-version.outputs.new_tag }}

            Automated multi-platform release of **OwnTerm** — the open-source, local-first, privacy-focused terminal emulator.

            ### Downloadable Packages

            | Operating System | Architecture | Package | Checksum |
            | :--- | :--- | :--- | :--- |
            | **macOS** | Apple Silicon (M1/M2/M3/M4) | [`ownterm-macos-arm64.tar.gz`](https://github.com/lcajigasm/ownterm/releases/download/${{ needs.prepare-version.outputs.new_tag }}/ownterm-macos-arm64.tar.gz) | `SHA256` in SHA256SUMS |
            | **macOS** | Intel (x86_64) | [`ownterm-macos-x86_64.tar.gz`](https://github.com/lcajigasm/ownterm/releases/download/${{ needs.prepare-version.outputs.new_tag }}/ownterm-macos-x86_64.tar.gz) | `SHA256` in SHA256SUMS |
            | **Linux** | x86_64 (glibc 2.31+) | [`ownterm-linux-x86_64.tar.gz`](https://github.com/lcajigasm/ownterm/releases/download/${{ needs.prepare-version.outputs.new_tag }}/ownterm-linux-x86_64.tar.gz) | `SHA256` in SHA256SUMS |
            | **Windows** | x86_64 (Windows 10 / 11) | [`ownterm-windows-x86_64.tar.gz`](https://github.com/lcajigasm/ownterm/releases/download/${{ needs.prepare-version.outputs.new_tag }}/ownterm-windows-x86_64.tar.gz) | `SHA256` in SHA256SUMS |

            ### Integrity Verification
            Verify downloaded packages using the attached `SHA256SUMS` file:
            ```bash
            sha256sum -c SHA256SUMS
            ```
