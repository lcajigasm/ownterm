name: Audit Warp Services Coupling

on:
  push:
    branches:
      - master
  pull_request:
  workflow_dispatch:

jobs:
  audit:
    name: OwnTerm privacy audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Run privacy audit
        run: bash scripts/audit-ownterm-privacy.sh
