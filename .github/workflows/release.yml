name: OwnTerm Release

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
  # A cache saved by a tag run is invisible to the next tag, and GitHub evicts a cache nobody
  # read for seven days. Only runs on the default branch save caches every tag can restore, so
  # this rebuilds them twice a week, away from the hours a release is usually tagged.
  schedule:
    - cron: "17 3 * * 1,4"
  pull_request:
    paths:
      - .github/workflows/release.yml
      - script/ci/install-protoc.sh
      - script/package-macos-dmg.sh
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to publish (vX.Y.Z). Empty only rebuilds the caches."
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ github.event_name }}-${{ github.ref }}-${{ inputs.tag }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # OwnTerm uploads no crash reports, so nothing symbolicates a release binary. Line tables only
  # cost compile time, a dsymutil pass, and download size.
  CARGO_PROFILE_RELEASE_DEBUG: "0"
  HOMEBREW_NO_AUTO_UPDATE: "1"
  HOMEBREW_NO_ANALYTICS: "1"
  HOMEBREW_NO_INSTALL_CLEANUP: "1"

jobs:
  build:
    name: Build (${{ matrix.arch }}, ${{ matrix.bin }})
    # The free standard macOS image. An account runs five macOS jobs at once, so this matrix has
    # to stay at four or the fifth job waits for a slot.
    runs-on: macos-15
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        arch:
          - arm64
          - x86_64
        # The TUI enables other features of the `warp` crate, so building it after the GUI in
        # one job recompiles that crate from scratch. Separate jobs do the two builds at once.
        bin:
          - ownterm
          - ownterm-tui
        include:
          - arch: arm64
            target: aarch64-apple-darwin
          - arch: x86_64
            target: x86_64-apple-darwin
          - bin: ownterm
            build_args: -p warp --bin ownterm
          - bin: ownterm-tui
            build_args: -p warp_tui --bin ownterm-tui

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # A manual run builds the requested tag with this workflow file, so a
          # runner-image fix on master can still publish binaries for that tag.
          ref: ${{ inputs.tag || github.sha }}

      - name: Install Rust
        uses: dtolnay/rust-toolchain@1.92.0
        with:
          targets: ${{ matrix.target }}

      # An older tag does not carry the CI scripts, so they come from this workflow's commit.
      - name: Checkout CI scripts
        uses: actions/checkout@v7
        with:
          path: ci-tools
          sparse-checkout: script/ci

      - name: Install Protoc
        run: bash ci-tools/script/ci/install-protoc.sh

      - name: Skip the Metal shader toolchain
        run: echo "WARP_LOCAL_SKIP_METAL=1" >> "$GITHUB_ENV"

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: release-${{ matrix.target }}-${{ matrix.bin }}
          save-if: ${{ github.ref == 'refs/heads/master' }}

      - name: Build ${{ matrix.bin }}
        run: cargo build --release --locked --target ${{ matrix.target }} ${{ matrix.build_args }}

      - name: Upload binary
        id: upload
        if: github.ref_type == 'tag' || inputs.tag != ''
        # The artifact service has answered a finished build with an HTML error page. One more
        # attempt below costs seconds; a failure here used to cost the whole build.
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: bin-${{ matrix.arch }}-${{ matrix.bin }}
          path: target/${{ matrix.target }}/release/${{ matrix.bin }}
          if-no-files-found: error
          retention-days: 1

      - name: Upload binary, second attempt
        if: steps.upload.outcome == 'failure'
        uses: actions/upload-artifact@v7
        with:
          name: bin-${{ matrix.arch }}-${{ matrix.bin }}
          path: target/${{ matrix.target }}/release/${{ matrix.bin }}
          if-no-files-found: error
          overwrite: true
          retention-days: 1

  publish:
    name: Package and publish
    needs: build
    if: github.ref_type == 'tag' || inputs.tag != ''
    # hdiutil and lipo exist only on macOS.
    runs-on: macos-15
    timeout-minutes: 30
    permissions:
      contents: write
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - name: Check the tag
        run: |
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Refusing non-semver tag: $TAG" >&2
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.sha }}

      - name: Download binaries
        uses: actions/download-artifact@v8
        with:
          pattern: bin-*
          path: bins

      - name: Package archives
        run: |
          mkdir -p dist
          for arch in arm64 x86_64; do
            stage="staging/$arch"
            mkdir -p "$stage"
            cp "bins/bin-$arch-ownterm/ownterm" "bins/bin-$arch-ownterm-tui/ownterm-tui" "$stage/"
            test -s "$stage/ownterm"
            test -s "$stage/ownterm-tui"
            # Artifacts do not keep the executable bit.
            chmod 755 "$stage/ownterm" "$stage/ownterm-tui"
            cp README.md LICENSE-AGPL LICENSE-MIT "$stage/"
            tar -C "$stage" -czf "dist/ownterm-macos-$arch.tar.gz" .
          done

      - name: Build OwnTerm.app disk image
        run: |
          bash script/package-macos-dmg.sh \
            --arm64 staging/arm64/ownterm \
            --x86_64 staging/x86_64/ownterm \
            --icon app/channels/oss/icon/no-padding/512x512.png \
            --version "${TAG#v}" \
            --out-dir dist
          rm -f dist/*.sha256
          if [[ ! -f dist/ownterm-macos-universal.dmg ]]; then
            if [[ ! -f dist/ownterm-macos-arm64.dmg ]]; then
              echo "packaging produced no disk image" >&2
              exit 1
            fi
            echo "::warning::No universal disk image. The Homebrew cask only follows ownterm-macos-universal.dmg and will stay on the previous version."
          fi

      - name: Write SHA256SUMS
        working-directory: dist
        run: |
          shasum -a 256 -- *.tar.gz *.dmg > SHA256SUMS
          cat SHA256SUMS

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cat > notes.md <<EOF
          OwnTerm $TAG

          Open-source, local-first terminal for macOS. No Warp account, no telemetry upload.

          \`ownterm-macos-universal.dmg\` holds \`OwnTerm.app\` for Apple Silicon and Intel. Homebrew installs the same image: \`brew install lcajigasm/tap/ownterm\`.
          The \`.tar.gz\` archives hold \`ownterm\` and \`ownterm-tui\` for each architecture, for the installer script.
          Verify downloads with \`SHA256SUMS\`.
          EOF
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/* --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$TAG" dist/* \
              --repo "$GITHUB_REPOSITORY" \
              --verify-tag \
              --title "OwnTerm $TAG" \
              --notes-file notes.md
          fi

      - name: Ask the Homebrew tap to update now
        env:
          GH_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          if [[ -z "$GH_TOKEN" ]]; then
            echo "::notice::HOMEBREW_TAP_TOKEN is not set. lcajigasm/homebrew-tap finds the release on its own schedule, within 15 minutes."
            exit 0
          fi
          if ! gh workflow run update.yml --repo lcajigasm/homebrew-tap --ref main; then
            echo "::warning::Could not start the tap update. The tap's own schedule still picks the release up."
          fi
