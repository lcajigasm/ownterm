# Please see the documentation for all configuration options:
# https://docs.github.com/en/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file

version: 2
updates:
  - package-ecosystem: "cargo"
    directory: "/"
    schedule:
      interval: "weekly"
    # Only send security updates, not general version updates. Crate versions follow upstream
    # Warp, which keeps the weekly upstream merge free of Cargo.lock conflicts.
    open-pull-requests-limit: 0
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      # Don't update to any action release that is less than two weeks old.
      default-days: 14
    groups:
      actions:
        patterns:
          - "*"
